# scrcpy-wifi-launcher 发布流水线
# 触发：push 形如 v1.0.0 的 tag
# 产物：scrcpy-wifi-launcher-<tag>.zip + 同名 .sha256，发布到 GitHub Release
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: 打包并创建 Release
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验发布所需文件
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 兼容两种布局：scripts/install.ps1（任务书约定）或根目录 install.ps1（当前 README 布局）
          $installScript = @('scripts/install.ps1', 'install.ps1') |
              Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          $uninstallScript = @('scripts/uninstall.ps1', 'uninstall.ps1') |
              Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $installScript) { throw '缺少 install.ps1（根目录或 scripts/）' }
          if (-not $uninstallScript) { throw '缺少 uninstall.ps1（根目录或 scripts/）' }
          foreach ($item in @('src', 'README.md', 'LICENSE')) {
              if (-not (Test-Path -LiteralPath $item)) {
                  throw "缺少发布所需文件：$item"
              }
          }
          $srcFiles = @(Get-ChildItem -LiteralPath 'src' -Recurse -File)
          if ($srcFiles.Count -eq 0) {
              throw 'src/ 为空，拒绝打包空发布'
          }
          Write-Host "安装脚本：$installScript；卸载脚本：$uninstallScript"
          Write-Host "发布文件检查通过（src/ 下 $($srcFiles.Count) 个文件）。"

      - name: 打包并计算 SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          if ([string]::IsNullOrWhiteSpace($tag)) {
              throw 'GITHUB_REF_NAME 为空，无法确定发布版本'
          }

          # 在 runner 临时目录准备带版本号的包根目录，保证解压后有一层文件夹
          $packageName = "scrcpy-wifi-launcher-$tag"
          $stage = Join-Path $env:RUNNER_TEMP $packageName
          if (Test-Path -LiteralPath $stage) {
              Remove-Item -LiteralPath $stage -Recurse -Force
          }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          Copy-Item -LiteralPath 'src' -Destination $stage -Recurse -Force
          New-Item -ItemType Directory -Path (Join-Path $stage 'scripts') -Force | Out-Null
          $installScript = @('scripts/install.ps1', 'install.ps1') |
              Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          $uninstallScript = @('scripts/uninstall.ps1', 'uninstall.ps1') |
              Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $installScript -or -not $uninstallScript) {
              throw '缺少 install.ps1 或 uninstall.ps1'
          }
          Copy-Item -LiteralPath $installScript -Destination (Join-Path $stage $installScript) -Force
          Copy-Item -LiteralPath $uninstallScript -Destination (Join-Path $stage $uninstallScript) -Force
          # 当前布局：scripts/install.cmd 是引导器，内部调用 ..\install.ps1
          if ((Test-Path -LiteralPath 'scripts/install.cmd') -and $installScript -eq 'install.ps1') {
              Copy-Item -LiteralPath 'scripts/install.cmd' -Destination (Join-Path $stage 'scripts/install.cmd') -Force
          }
          Copy-Item -LiteralPath 'README.md' -Destination (Join-Path $stage 'README.md') -Force
          Copy-Item -LiteralPath 'LICENSE' -Destination (Join-Path $stage 'LICENSE') -Force

          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          $zipPath = Join-Path $dist "$packageName.zip"
          if (Test-Path -LiteralPath $zipPath) {
              Remove-Item -LiteralPath $zipPath -Force
          }
          Compress-Archive -Path $stage -DestinationPath $zipPath -CompressionLevel Optimal

          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $shaPath = "$zipPath.sha256"
          "$hash  $packageName.zip" | Out-File -LiteralPath $shaPath -Encoding ascii

          Write-Host "发布包：$zipPath"
          Write-Host "SHA256：$hash"
          Get-ChildItem -LiteralPath $dist | Format-Table Name, Length

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.sha256
