name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请说明使用场景和期望效果，而不是只写“希望加个功能”。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 issue，确认没有重复建议
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 使用场景 / 要解决的问题
      description: 你目前在什么场景下感到不方便？例如“每次换 WiFi 都要手动查 IP”
      placeholder: 描述当前的做法和痛点
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望启动器或脚本怎样处理
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你试过哪些其他做法，为什么不够好
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考链接、截图、类似项目的实现等
    validations:
      required: false
